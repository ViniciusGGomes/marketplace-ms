services:
  marketplace-users-db:
    image: postgres:15
    container_name: marketplace-users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - marketplace-users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d users_db']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  marketplace-users-db-data:
